# Built-in, generic merchant rules (source=seed). Your own rules always take precedence.
# match_type: contains (case-insensitive on normalised description) | regex
rules:
  # Food
  - {pattern: "wholefds", target: "Expenses:Food:Groceries", payee: "Whole Foods"}
  - {pattern: "whole foods", target: "Expenses:Food:Groceries", payee: "Whole Foods"}
  - {pattern: "trader joe", target: "Expenses:Food:Groceries", payee: "Trader Joe's"}
  - {pattern: "costco", target: "Expenses:Food:Groceries", payee: "Costco"}
  - {pattern: "safeway", target: "Expenses:Food:Groceries", payee: "Safeway"}
  - {pattern: "h mart", target: "Expenses:Food:Groceries", payee: "H Mart"}
  - {pattern: "uber eats", target: "Expenses:Food:Dining", payee: "Uber Eats"}
  - {pattern: "doordash", target: "Expenses:Food:Dining", payee: "DoorDash"}
  - {pattern: "starbucks", target: "Expenses:Food:Coffee", payee: "Starbucks"}
  - {pattern: "blue bottle", target: "Expenses:Food:Coffee", payee: "Blue Bottle"}
  - {pattern: "sweetgreen", target: "Expenses:Food:Dining", payee: "Sweetgreen"}
  # Transport
  - {pattern: "shell oil", target: "Expenses:Transport:Fuel", payee: "Shell"}
  - {pattern: "chevron", target: "Expenses:Transport:Fuel", payee: "Chevron"}
  - {pattern: "exxon", target: "Expenses:Transport:Fuel", payee: "Exxon"}
  - {pattern: "uber trip", target: "Expenses:Transport:Rideshare", payee: "Uber"}
  - {pattern: "lyft", target: "Expenses:Transport:Rideshare", payee: "Lyft"}
  - {pattern: "mta*", target: "Expenses:Transport:Public", payee: "MTA"}
  # Travel
  - {pattern: "delta air", target: "Expenses:Travel:Flights", payee: "Delta"}
  - {pattern: "united airlines", target: "Expenses:Travel:Flights", payee: "United"}
  - {pattern: "american airlines", target: "Expenses:Travel:Flights", payee: "American Airlines"}
  - {pattern: "airbnb", target: "Expenses:Travel:Lodging", payee: "Airbnb"}
  - {pattern: "marriott", target: "Expenses:Travel:Lodging", payee: "Marriott"}
  # Subscriptions & bills
  - {pattern: "netflix", target: "Expenses:Subscriptions:Streaming", payee: "Netflix"}
  - {pattern: "spotify", target: "Expenses:Subscriptions:Streaming", payee: "Spotify"}
  - {pattern: "hulu", target: "Expenses:Subscriptions:Streaming", payee: "Hulu"}
  - {pattern: "apple.com/bill", target: "Expenses:Subscriptions:Software", payee: "Apple"}
  - {pattern: "claude.ai", target: "Expenses:Subscriptions:Software", payee: "Claude"}
  - {pattern: "openai", target: "Expenses:Subscriptions:Software", payee: "OpenAI"}
  - {pattern: "anthropic", target: "Expenses:Subscriptions:Software", payee: "Anthropic"}
  - {pattern: "cursor", target: "Expenses:Subscriptions:Software", payee: "Cursor"}
  - {pattern: "icloud", target: "Expenses:Subscriptions:Software", payee: "iCloud"}
  - {pattern: "verizon", target: "Expenses:Housing:Phone & Internet", payee: "Verizon"}
  - {pattern: "comcast", target: "Expenses:Housing:Phone & Internet", payee: "Comcast"}
  - {pattern: "t-mobile", target: "Expenses:Housing:Phone & Internet", payee: "T-Mobile"}
  - {pattern: "pse&g", target: "Expenses:Housing:Utilities", payee: "PSE&G"}
  - {pattern: "con ed", target: "Expenses:Housing:Utilities", payee: "Con Edison"}
  # Shopping
  - {pattern: "amazon", target: "Expenses:Shopping:Online", payee: "Amazon"}
  - {pattern: "amzn", target: "Expenses:Shopping:Online", payee: "Amazon"}
  - {pattern: '\btarget\b', match_type: regex, target: "Expenses:Shopping:General", payee: "Target"}
  # Cash & fees
  - {pattern: "atm withdrawal", target: "Expenses:Cash", payee: "ATM"}
  - {pattern: "foreign transaction fee", target: "Expenses:Fees:Bank"}
  - {pattern: "late fee", target: "Expenses:Fees:Bank"}
  # Income
  - {pattern: "interest payment", target: "Income:Interest", payee: "Bank interest"}
  - {pattern: "interest paid", target: "Income:Interest", payee: "Bank interest"}
  - {pattern: "payroll", target: "Income:Salary"}
  - {pattern: "direct dep", target: "Income:Salary"}
  # 中文常见
  - {pattern: "美团", target: "Expenses:Food:Dining", payee: "美团"}
  - {pattern: "饿了么", target: "Expenses:Food:Dining", payee: "饿了么"}
  - {pattern: "滴滴", target: "Expenses:Transport:Rideshare", payee: "滴滴"}
  - {pattern: "余额宝", target: "Income:Interest", payee: "余额宝"}
  - {pattern: "代发工资", target: "Income:Salary"}
  - {pattern: "结息", target: "Income:Interest", payee: "银行利息"}

